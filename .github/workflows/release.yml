# 建置 Windows 與 macOS 安裝檔，放到 GitHub Releases 的草稿。
# 只在發佈時手動觸發（Actions 分頁 > 建置安裝檔 > Run workflow）；PR 的檢查在本地 pre-push 做。
name: 建置安裝檔

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            # 一個安裝檔同時支援 Apple 晶片與 Intel
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      # 第三方 action 一律釘在 commit SHA
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: 安裝 Rust（runner 內建的 rustup）
        shell: bash
        run: |
          # 版本寫死，和本地 docker 建置用的一致
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            rustup target add --toolchain 1.99.1 aarch64-apple-darwin x86_64-apple-darwin
          fi

      - name: 安裝套件
        run: npm ci

      - name: 建置並上傳到 Release 草稿
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: API Chat v__VERSION__
          releaseBody: |
            安裝方式見 README 的「安裝桌面版」：https://github.com/Arce0406/api-chat#安裝桌面版
            - Windows：下載 `.exe` 安裝檔
            - macOS：下載 `.dmg`（Apple 晶片與 Intel 都可以用）
            安裝檔沒有付費簽章，第一次打開會被系統警告，照 README 的步驟允許即可。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
