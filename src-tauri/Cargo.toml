[package]
name = "api-chat"
version = "0.1.0"
description = "用自己的 Anthropic API 金鑰對話的桌面 App"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "api_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

# 版本全部寫死（=），實際解析結果記在 Cargo.lock
[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-opener = "=2.7.2"
tauri-plugin-dialog = "=2.8.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
